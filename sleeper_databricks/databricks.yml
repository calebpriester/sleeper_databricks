# This is a Databricks asset bundle definition for sleeper_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sleeper_databricks
  uuid: 2bafe952-9f38-4030-af08-7c43387a4ed0

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  ingest_schema:
    description: The schema to use for Sleeper data ingestion
  analysis_schema:
    description: The schema to use for Sleeper data analysis

targets:
  # dev:
  #   # The default target uses 'mode: development' to create a development copy.
  #   # - Deployed resources get prefixed with '[dev my_user_name]'
  #   # - Any job schedules and triggers are paused by default.
  #   # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
  #   mode: development
  #   default: true
  #   workspace:
  #     host: https://dbc-a464ea27-fdef.cloud.databricks.com
  #   variables:
  #     catalog: workspace
  #     schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    default: true
    workspace:
      host: https://dbc-a464ea27-fdef.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/calebhpriester@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/calebhpriester@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      ingest_schema: sleeper_raw
      analysis_schema: sleeper_analysis
    permissions:
      - user_name: calebhpriester@gmail.com
        level: CAN_MANAGE
